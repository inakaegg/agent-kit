name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # テストはpre-commit hookをそのまま走らせる。hookはgitleaksを必須にしていて、
      # 未導入だとcommit自体を止めるため、テストの前に入れておく。
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Validate the kit structure and public bundle
        run: python3 scripts/validate-kit.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

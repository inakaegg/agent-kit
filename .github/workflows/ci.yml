name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the kit structure and public bundle
        run: python3 scripts/validate-kit.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
